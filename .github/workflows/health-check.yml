name: Health Check

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:

jobs:
  ping:
    name: Ping production
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        run: |
          URL="${{ vars.PRODUCTION_URL }}"

          if [ -z "$URL" ]; then
            echo "PRODUCTION_URL not set — skipping health check"
            echo "Set it in: GitHub repo → Settings → Variables → Actions"
            exit 0
          fi

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/api/health" --max-time 15)

          echo "HTTP status: $RESPONSE"

          if [ "$RESPONSE" != "200" ]; then
            echo "::error::Health check failed — HTTP $RESPONSE"
            exit 1
          fi

          curl -s "$URL/api/health" | python3 -m json.tool
